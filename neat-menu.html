<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFBED">
<title>NEAT | المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAFBED;
    --paper:#FFFFFA;
    --gold:#B08A3E;
    --gold-dark:#8C6A26;
    --gold-soft:#EFE6CF;
    --ink:#2B2419;
    --muted:#8A8172;
    --line:#ECE6D3;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{overflow-x:clip}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--cream);color:var(--ink);max-width:520px;margin:0 auto;min-height:100vh}

  header{text-align:center;padding:34px 20px 18px}
  header img{width:190px;max-width:60%;display:block;margin:0 auto}
  header p{margin-top:10px;color:var(--muted);font-size:14px;letter-spacing:.5px}
  .divider{width:46px;height:2px;background:var(--gold);margin:14px auto 0;border-radius:2px}

  nav{position:sticky;top:0;z-index:10;background:rgba(250,251,237,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1px solid var(--gold);background:transparent;color:var(--gold-dark);font:500 14px 'Tajawal';padding:8px 18px;border-radius:999px;cursor:pointer;transition:.2s}
  .tab.active{background:var(--gold);color:#fff}

  main{padding:8px 16px 40px}
  section{padding-top:22px;scroll-margin-top:64px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sec-head h2{font-size:20px;font-weight:800;color:var(--ink)}
  .sec-head span{flex:1;height:1px;background:var(--line)}
  .sec-head small{color:var(--muted);font-size:12px}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .item{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(140,106,38,.05)}
  .icon{height:86px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;font-size:38px;margin-bottom:10px}
  .info{flex:1;display:flex;flex-direction:column}
  .name{font-size:15.5px;font-weight:700;line-height:1.4}
  .desc{color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:4px;flex:1}
  .row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:10px}
  .price{font-weight:800;color:var(--gold-dark);font-size:15px;white-space:nowrap}
  .price small{font-size:11px;font-weight:500;color:var(--muted);margin-right:2px}
  .cal{display:inline-flex;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--gold-dark);background:var(--gold-soft);padding:2px 7px;border-radius:999px;white-space:nowrap}
  .ctl{margin-top:10px}
  .ctl .add{width:100%}
  .ctl .stepper{justify-content:space-between}

  .qty{display:flex;align-items:center;gap:10px;margin-top:8px}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .meta .cal{margin-top:0}
  .add{border:1px solid var(--gold);background:transparent;color:var(--gold-dark);font:700 13px 'Tajawal';padding:5px 16px;border-radius:999px;cursor:pointer}
  .stepper{display:flex;align-items:center;gap:10px;background:var(--gold);border-radius:999px;padding:3px}
  .stepper button{width:28px;height:28px;border:0;border-radius:50%;background:#fff;color:var(--gold-dark);font:800 17px 'Tajawal';cursor:pointer;line-height:1}
  .stepper b{color:#fff;min-width:14px;text-align:center;font-size:15px}

  .cartbar{position:fixed;bottom:16px;left:50%;transform:translate(-50%,140%);width:calc(100% - 32px);max-width:488px;background:var(--ink);color:#fff;border:0;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font:700 15px 'Tajawal';cursor:pointer;box-shadow:0 10px 30px rgba(43,36,25,.3);transition:transform .3s;z-index:20}
  .cartbar.show{transform:translate(-50%,0)}
  .cartbar .count{background:var(--gold);border-radius:8px;padding:2px 9px;margin-left:8px}

  .overlay{position:fixed;inset:0;background:rgba(43,36,25,.45);opacity:0;pointer-events:none;transition:.25s;z-index:30}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--cream);border-radius:22px 22px 0 0;padding:10px 18px 24px;transition:transform .3s;z-index:31}
  .sheet.show{transform:translate(-50%,0)}
  .grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
  .sheet h3{font-size:19px;font-weight:800;margin-bottom:12px}
  .line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
  .line .ln{font-weight:700;font-size:15px}
  .line .lp{color:var(--muted);font-size:13px}
  .total{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding:14px 0 6px}
  .total span:last-child{color:var(--gold-dark)}
  .field{margin-top:14px}
  .field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
  .field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;font:15px 'Tajawal';color:var(--ink);outline:none}
  .field input:focus,.field textarea:focus{border-color:var(--gold)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 8px;text-align:center;font:600 14px 'Tajawal';color:var(--ink);cursor:pointer}
  .opt.active{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-dark)}
  .note{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.7;text-align:center}
  .send{width:100%;margin-top:14px;border:0;border-radius:14px;background:var(--gold);color:#fff;font:800 16px 'Tajawal';padding:15px;cursor:pointer}
  .send:disabled{opacity:.5}
  .err{color:#B3261E;font-size:13px;margin-top:6px;display:none}
  .done{text-align:center;padding:20px 0}
  .done .big{font-size:46px}
  .done h3{margin-top:8px}
  .done .num{display:inline-block;margin-top:10px;background:var(--gold-soft);color:var(--gold-dark);font-weight:800;font-size:22px;padding:8px 20px;border-radius:12px;letter-spacing:2px}
  body.has-cart footer{padding-bottom:100px}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 20px 34px;line-height:1.9}
  footer b{color:var(--gold-dark);letter-spacing:3px}
</style>
</head>

  ]},
];

// ===== الإعدادات: غيّر رقم واتساب المقهى هنا (بصيغة دولية بدون + أو أصفار) =====
const WHATSAPP = "966500000000";

const ITEMS = {};
MENU.forEach(s => s.items.forEach((it, k) => { it.id = s.id + k; ITEMS[it.id] = it; }));
const cart = {};

const tabs = document.getElementById('tabs');
const menu = document.getElementById('menu');

MENU.forEach((sec, idx) => {
  const t = document.createElement('button');
  t.className = 'tab' + (idx === 0 ? ' active' : '');
  t.textContent = sec.title;
  t.dataset.target = sec.id;
  t.onclick = () => window.scrollTo({top: document.getElementById(sec.id).getBoundingClientRect().top + window.scrollY - 60, behavior:'smooth'});
  tabs.appendChild(t);

  const s = document.createElement('section');
  s.id = sec.id;
  s.innerHTML = `<div class="sec-head"><h2>${sec.title}</h2><span></span><small>${sec.items.length} أصناف</small></div>` +
    '<div class="grid">' + sec.items.map(it => `
      <div class="item">
        <div class="icon">${it.i}</div>
        <div class="info">
          <div class="name">${it.n}</div>
          <div class="desc">${it.d}</div>
          <div class="row"><div class="price">${it.p}<small>ر.س</small></div><div class="cal">🔥 ${it.c} سعرة</div></div>
          <div class="ctl" data-id="${it.id}"></div>
        </div>
      </div>`).join('') + '</div>';
  menu.appendChild(s);
});

// تفعيل التبويب حسب القسم الظاهر
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      document.querySelectorAll('.tab').forEach(b => {
        const on = b.dataset.target === e.target.id;
        b.classList.toggle('active', on);
        if (on) tabs.scrollTo({left: b.offsetLeft - (tabs.clientWidth - b.offsetWidth) / 2, behavior:'smooth'});
      });
    }
  });
}, {rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('section').forEach(s => obs.observe(s));

// ===== السلة =====
const fmt = n => (Math.round(n * 100) / 100).toFixed(2).replace(/\.00$/, '');
function setQty(id, q){ if (q <= 0) delete cart[id]; else cart[id] = q; render(); }
function cartList(){ return Object.entries(cart).map(([id, q]) => ({...ITEMS[id], q})); }
function cartTotal(){ return cartList().reduce((a, x) => a + x.q * parseFloat(x.p), 0); }
function cartCount(){ return Object.values(cart).reduce((a, b) => a + b, 0); }

function ctlHTML(id){
  const q = cart[id] || 0;
  return q ? `<div class="stepper"><button onclick="setQty('${id}',${q-1})">−</button><b>${q}</b><button onclick="setQty('${id}',${q+1})">+</button></div>`
           : `<button class="add" onclick="setQty('${id}',1)">+ إضافة</button>`;
}
function render(){
  document.querySelectorAll('.ctl').forEach(el => el.innerHTML = ctlHTML(el.dataset.id));
  const c = cartCount();
  document.getElementById('cartCount').textContent = c;
  document.getElementById('cartTotal').textContent = fmt(cartTotal()) + ' ر.س';
  document.getElementById('cartbar').classList.toggle('show', c > 0);
  document.body.classList.toggle('has-cart', c > 0);
  if (document.getElementById('sheet').classList.contains('show') && !submitted) {
    if (c === 0) closeSheet(); else drawSheet();
  }
}

// ===== صفحة إتمام الطلب =====
let mode = 'pickup', submitted = false;
const form = { name:'', table:'', notes:'' };

function openSheet(){ submitted = false; drawSheet(); document.getElementById('sheet').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }
function setMode(m){ mode = m; drawSheet(); }

function drawSheet(){
  const lines = cartList().map(x => `
    <div class="line">
      <div><div class="ln">${x.n}</div><div class="lp">${fmt(x.q * parseFloat(x.p))} ر.س</div></div>
      <div class="stepper"><button onclick="setQty('${x.id}',${x.q-1})">−</button><b>${x.q}</b><button onclick="setQty('${x.id}',${x.q+1})">+</button></div>
    </div>`).join('');
  document.getElementById('sheetBody').innerHTML = `
    <h3>طلبك</h3>
    ${lines}
    <div class="total"><span>الإجمالي</span><span>${fmt(cartTotal())} ر.س</span></div>

    <div class="field">
      <label>طريقة الاستلام</label>
      <div class="opts">
        <button class="opt ${mode==='pickup'?'active':''}" onclick="setMode('pickup')">🛍️ استلام من الكاشير</button>
        <button class="opt ${mode==='table'?'active':''}" onclick="setMode('table')">🪑 على الطاولة</button>
      </div>
    </div>
    <div class="field">
      <label>الاسم</label>
      <input id="fName" placeholder="اسمك عشان ننادي عليك" value="${form.name}" oninput="form.name=this.value">
    </div>
    ${mode==='table' ? `
    <div class="field">
      <label>رقم الطاولة</label>
      <input id="fTable" inputmode="numeric" placeholder="مكتوب على طاولتك" value="${form.table}" oninput="form.table=this.value">
    </div>` : ''}
    <div class="field">
      <label>ملاحظات (اختياري)</label>
      <textarea id="fNotes" rows="2" placeholder="مثلاً: حليب لوز، بدون سكر" oninput="form.notes=this.value">${form.notes}</textarea>
    </div>
    <div class="err" id="err"></div>
    <button class="send" onclick="submitOrder()">إرسال الطلب عبر واتساب</button>
    <div class="note">الدفع عند الكاشير · سيتم فتح واتساب لإرسال الطلب للمقهى</div>`;
}

function submitOrder(){
  const err = document.getElementById('err');
  const name = form.name.trim(), table = form.table.trim();
  if (!name) { err.textContent = 'فضلاً اكتب اسمك'; err.style.display = 'block'; return; }
  if (mode === 'table' && !table) { err.textContent = 'فضلاً اكتب رقم الطاولة'; err.style.display = 'block'; return; }

  const no = String(Math.floor(100 + Math.random() * 900));
  const items = cartList().map(x => `• ${x.n} × ${x.q} = ${fmt(x.q * parseFloat(x.p))} ر.س`).join('\n');
  const msg =
`🧾 طلب جديد - NEAT
رقم الطلب: #${no}
الاسم: ${name}
الاستلام: ${mode === 'table' ? 'على الطاولة رقم ' + table : 'من الكاشير'}

${items}

الإجمالي: ${fmt(cartTotal())} ر.س
${form.notes.trim() ? 'ملاحظات: ' + form.notes.trim() + '\n' : ''}الدفع: عند الكاشير`;

  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');

  submitted = true;
  document.getElementById('sheetBody').innerHTML = `
    <div class="done">
      <div class="big">✅</div>
      <h3>تم تجهيز طلبك</h3>
      <div class="note">أرسل الرسالة في واتساب، و${mode==='table' ? 'بنوصل طلبك لطاولتك' : 'بنادي على اسمك عند الكاشير'}</div>
      <div class="num">#${no}</div>
      <button class="send" onclick="newOrder()">طلب جديد</button>
    </div>`;
}
function newOrder(){ Object.keys(cart).forEach(k => delete cart[k]); form.notes = ''; submitted = false; closeSheet(); render(); }

render();
</script>
</body>
</html>
